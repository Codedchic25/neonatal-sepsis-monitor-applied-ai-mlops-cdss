# ============================================================
# Sepsis Monitor AI - Unified MLOps & Security CI Pipeline
# ============================================================

name: Sepsis Monitor AI - Enterprise CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/mlops-hardening
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Code Quality & Pytest Verification Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv (Fast Python Package Installer)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: latest

      - name: Install Project Dependencies
        run: uv sync

      - name: Run Ruff Static Code Analysis
        run: uv run ruff check . --output-format=github

      - name: Initialize Relational Database Schema
        run: |
          uv run alembic upgrade head
          touch sepsis_neonatal.db

      - name: Run Pytest Test Suite
        run: uv run pytest -v

  docker-compilation:
    name: Docker Runtime Image Integrity Matrix
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run Integrity Validation)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nicu-sepsis-monitor-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
